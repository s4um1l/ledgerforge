# Northstar Analytics Inc. — machine-readable accounting policy.
#
# v0.0 SCAFFOLD. Phase 4 freezes the real world alongside the v0.1 benchmark.
#
# Thresholds live here, never in prompts or in control code, so the
# automation/risk curve can be generated by sweeping this file.

benchmark_version: v0.0-scaffold

invoice_tolerance:
  max_absolute_difference: 100
  max_percentage_difference: 0.01

capitalization:
  threshold: 5000
  minimum_useful_life_months: 12

month_end_cutoff:
  # Invoices dated after the period being closed may not post to it.
  allow_post_period_posting: false

duplicates:
  # Any document already present in the ledger goes to a human.
  block_on_ledger_match: true

variance:
  # Below this, a budget variance needs no explanation.
  immaterial_absolute: 2000
  immaterial_percentage: 0.05
