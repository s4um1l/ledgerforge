# Northstar Analytics Inc. — machine-readable accounting policy.
#
# FROZEN as benchmark v0.1. Thresholds live here, never in prompts or control
# code, so the automation/risk curve can be produced by sweeping this file.

benchmark_version: v0.1

period:
  closing: "2026-09"
  cutoff_date: "2026-09-30"
  prior_period_locked: true

invoice_tolerance:
  # An invoice may exceed its purchase order only within BOTH limits.
  max_absolute_difference: 100
  max_percentage_difference: 0.01
  # Blanket orders carry no control total; their amount is not a tolerance base.
  blanket_orders_have_no_amount: true

capitalization:
  threshold: 5000
  minimum_useful_life_months: 12
  # Items acquired together for one purpose are assessed as one unit.
  aggregate_related_items: true

month_end_cutoff:
  allow_post_period_posting: false
  # Work performed inside the period but billed after it is accrued, not rejected.
  accrue_late_invoices_for_work_in_period: true

duplicates:
  block_on_ledger_match: true
  # Same vendor, same amount, within this window, is a suspected duplicate even
  # when the document numbers differ.
  same_amount_window_days: 30

cash_application:
  # A payment that differs from the invoice is not automatically an exception.
  allow_short_pay_with_remittance_advice: true
  max_unexplained_difference: 25

variance:
  immaterial_absolute: 2000
  immaterial_percentage: 0.05
  # Usage-based spend moves legitimately; a wider band applies.
  usage_based_accounts: ["5000", "5100"]
  usage_based_immaterial_percentage: 0.25
  explanation_required_above_percentage: 0.10

revenue_recognition:
  subscription_method: ratable
  services_method: milestone_acceptance
  require_signed_contract: true

prepaid:
  # Anything covering more than this many months is a prepaid, not an expense.
  minimum_months_to_defer: 3
  amortization: straight_line

expenses:
  receipt_required_above: 75
  travel_policy_limit: 400

review_requirements:
  # Company approval matrix, in dollars.
  staff_accountant_limit: 1000
  controller_limit: 10000
  cfo_required_above: 10000
  any_capitalized_asset: true
  any_closed_period_entry: true
